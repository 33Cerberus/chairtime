services:
  postgres:
    image: postgres:17-alpine
    container_name: chairtime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chairtime
      POSTGRES_PASSWORD: chairtime
      POSTGRES_DB: chairtime
    ports:
      # Host port 5433 so it never collides with a locally installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - chairtime-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chairtime -d chairtime"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chairtime-pg:
