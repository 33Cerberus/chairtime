# Production stack: PostgreSQL, the app (API + web in one container), and Caddy for HTTPS.
#
#   cp .env.production.example .env.production      # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# See docs/operations.md for the full procedure, backups and the first owner account.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chairtime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: chairtime
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chairtime -d chairtime"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published: only the app can reach the database.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://chairtime:${POSTGRES_PASSWORD}@postgres:5432/chairtime?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      WEB_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      # One proxy (Caddy) sits in front, so the client address comes from its header.
      TRUST_PROXY: "1"
      SHOP_TIMEZONE: ${SHOP_TIMEZONE:-Europe/Warsaw}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    volumes:
      - uploads:/app/apps/api/uploads
    # Not published either: Caddy is the only way in.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    # Obtains and renews the TLS certificate for DOMAIN automatically.
    command: caddy reverse-proxy --from ${DOMAIN} --to app:4000
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
